<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ruta de Internacionalización 2027</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f5ff;--ink:#1d1550;--prim:#6c3cff;--rosa:#ff5fb2;--coral:#ff4f6d;--sol:#ffc61a;--menta:#00c9a7;--cielo:#1e90ff;--noche:#1d1550;--card:#fff;--sombra:0 8px 24px #6c3cff26}
*{box-sizing:border-box}
body{margin:0;font-family:"Poppins","Segoe UI",system-ui,sans-serif;color:var(--ink);min-height:100vh;
  background:radial-gradient(900px 520px at 0 0,#e2d9ff,transparent),radial-gradient(800px 520px at 100% 10%,#cff7ec,transparent),radial-gradient(800px 600px at 50% 100%,#ffe0ea,transparent),var(--bg);background-attachment:fixed}
header{position:relative;overflow:hidden;background:linear-gradient(115deg,var(--prim),var(--rosa) 60%,var(--coral));color:#fff;padding:12px 28px}
header:before,header:after{content:"";position:absolute;border-radius:50%;background:#ffffff26}
header:before{width:220px;height:220px;right:-40px;top:-90px}header:after{width:120px;height:120px;right:180px;bottom:-70px;background:#ffc61a55}
header h1{margin:0;font-size:clamp(20px,2.4vw,30px);font-weight:800;position:relative}header p{margin:2px 0 0;font-size:14px;opacity:.92;position:relative}
nav{display:flex;gap:8px;flex-wrap:wrap;padding:12px 28px;position:sticky;top:0;background:#ffffffcc;backdrop-filter:blur(10px);z-index:5;align-items:center;box-shadow:0 2px 14px #6c3cff1f}
nav button{border:0;border-radius:999px;padding:9px 16px;font-weight:600;font-size:14px;font-family:inherit;cursor:pointer;background:#ece8ff;color:var(--prim);transition:.2s}
nav button:hover{transform:translateY(-2px)}
nav button.on{background:linear-gradient(115deg,var(--prim),var(--rosa));color:#fff;transform:scale(1.07);box-shadow:0 6px 16px #6c3cff55}
#clock{position:fixed;right:16px;bottom:16px;z-index:9;background:var(--noche);color:#fff;border-radius:22px;padding:12px 16px;box-shadow:0 10px 28px #1d155077;min-width:220px;text-align:center}
#clock.low{background:var(--coral);animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
#tm{font:800 46px ui-monospace,monospace;display:block;color:var(--sol)}#clock.low #tm{color:#fff}
#clock .opts{display:flex;gap:6px;justify-content:center;margin-top:6px}
#clock button{border:0;border-radius:10px;padding:6px 11px;font-weight:700;font-size:14px;font-family:inherit;cursor:pointer;background:var(--sol);color:var(--noche)}
#bar{height:6px;background:linear-gradient(90deg,var(--menta),var(--sol));border-radius:3px;margin-top:8px;transition:width 1s linear}
#end{display:none;position:fixed;inset:0;z-index:20;background:linear-gradient(135deg,var(--prim),var(--rosa),var(--coral));align-items:center;justify-content:center;flex-direction:column;color:#fff;text-align:center;animation:pop .4s;padding:20px}
#end h1{font-size:clamp(40px,8vw,96px);margin:0}
.spin{display:inline-block;width:1em;height:1em;border:3px solid #fff6;border-top-color:#fff;border-radius:50%;animation:rot .8s linear infinite;vertical-align:-3px}@keyframes rot{to{transform:rotate(360deg)}}
.slide{animation:slide .45s ease}@keyframes slide{from{opacity:0;transform:translateX(40px)}}
#prev,#next{position:fixed;bottom:16px;z-index:9;border:0;border-radius:50%;width:58px;height:58px;font-size:22px;cursor:pointer;background:linear-gradient(135deg,var(--prim),var(--rosa));color:#fff;box-shadow:0 8px 20px #6c3cff66;transition:.2s}
#prev:hover,#next:hover{transform:scale(1.12)}
#prev{left:16px}#next{left:88px}
main{padding:18px 28px 100px;max-width:1500px;margin:auto}
/* Portada: ocupa exactamente la pantalla, sin scroll */
body.home{overflow:hidden;height:100vh}body.home header{display:none}
body.home main{height:100vh;padding:0 28px;display:flex;flex-direction:column;justify-content:center}
h2{margin:0 0 4px;font-size:clamp(24px,3.2vw,36px);font-weight:800;color:var(--prim)} .sub{opacity:.75;margin:0 0 16px}
.btn{border:0;border-radius:999px;padding:11px 20px;font-weight:700;font-size:15px;font-family:inherit;cursor:pointer;background:linear-gradient(115deg,var(--prim),#8f6bff);color:#fff;box-shadow:0 6px 16px #6c3cff44;transition:.2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 22px #6c3cff55}.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.alt{background:linear-gradient(115deg,var(--sol),#ff9f1a);color:var(--noche);box-shadow:0 6px 16px #ffb30055}.btn.ghost{background:#ece8ff;color:var(--prim);box-shadow:none}
input,select,textarea{font:inherit;padding:10px 12px;border-radius:12px;border:2px solid #ddd6ff;background:#fff;color:var(--ink);width:100%;outline:0;transition:.2s}
input:focus,select:focus,textarea:focus{border-color:var(--prim);box-shadow:0 0 0 4px #6c3cff22}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}.row>*{width:auto;flex:1 1 180px}.row .btn{flex:0 0 auto}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.panel{background:var(--card);border-radius:22px;padding:16px;box-shadow:var(--sombra)}
.chip{display:inline-block;padding:4px 12px;border-radius:999px;font-size:12px;font-weight:700;background:#ece8ff;color:var(--prim);margin:2px}
.g{border-top:10px solid var(--c)}.g h3{margin:0 0 8px;color:var(--c);font-weight:800}
.note{padding:14px;border-radius:6px 20px 6px 20px;color:#1d1550;box-shadow:0 6px 14px #1d155030;margin-bottom:12px;animation:pop .35s;cursor:grab;font-size:15px;font-weight:500}
.note:nth-child(even){transform:rotate(1.2deg)}.note:nth-child(odd){transform:rotate(-1deg)}
.note .txt{display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.more{border:0;background:#ffffffb3;border-radius:999px;margin-top:6px;padding:4px 12px;font-weight:700;font-size:13px;font-family:inherit;cursor:pointer;color:var(--prim)}
.note small{display:block;opacity:.7;margin-top:6px;font-weight:700}
@keyframes pop{from{transform:scale(.6) rotate(-6deg);opacity:0}}
.cols{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.col{background:#ffffffd9;border-radius:22px;min-height:200px;padding:12px;border-top:10px solid var(--c);box-shadow:var(--sombra)}
.col.over{outline:4px dashed var(--c);background:#fff} .col h4{margin:0 0 8px;color:var(--c);font-weight:800}
.vote{border:0;background:#fff5cc;border-radius:999px;cursor:pointer;margin-top:6px;padding:4px 12px;font-weight:700;font-size:13px;font-family:inherit}
.form{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}.form .full{grid-column:1/-1}
.st{cursor:pointer;border:0;border-radius:999px;padding:5px 14px;font-weight:700;font-size:13px;font-family:inherit}
.st.ok{background:var(--menta);color:#fff}.st.pend{background:var(--sol);color:var(--noche)}
.big{font-size:48px;font-weight:800;background:linear-gradient(115deg,var(--prim),var(--rosa));-webkit-background-clip:text;background-clip:text;color:transparent}
</style>
</head>
<body>
<header><h1>🌎 Ruta de Internacionalización 2027</h1><p>Taller de cocreación · Universidades y Secretarías de Educación</p></header>
<main id="app"></main>
<button id="prev" title="Anterior" onclick="go(S.step-1)">◀</button><button id="next" title="Siguiente" onclick="go(S.step+1)">▶</button>
<div id="clock">⏱<span id="tm">00:00</span>
  <div class="opts"><button onclick="startTimer(5)">5</button><button onclick="startTimer(10)">10</button><button onclick="startTimer(15)">15</button><button onclick="startTimer(20)">20</button><button onclick="stopTimer()" style="background:#fff3">■</button></div><div id="bar" style="width:0"></div></div>
<div id="okm" onclick="this.style.display='none'" style="display:none;position:fixed;inset:0;z-index:40;background:#1d1550d9;align-items:center;justify-content:center;padding:16px"></div>
<div id="qrm"onclick="closeQr()" style="display:none;position:fixed;inset:0;z-index:30;background:#1d1550d9;align-items:center;justify-content:center;padding:16px"></div>
<div id="end"><h1>⏰ ¡Se acabó el tiempo!</h1><p style="font-size:24px">Cierren la idea en la que están y pasemos al siguiente paso.</p>
  <button class="btn alt" style="font-size:20px" onclick="this.parentNode.style.display='none'">Continuar</button></div>
<script>
const INST=["Universidad de Caldas","Universidad Autónoma de Manizales","Universidad Católica de Manizales","Universidad de Manizales","UNIOC","Uniminuto","UNAD","SED - Secretaría de Educación","SEM - Secretaría de Educación"];
const LINES=[{n:"Internacionalización del currículo",c:"#6c3cff",e:"📚"},{n:"Competencias globales e interculturales",c:"#ff4f6d",e:"🌎"},{n:"Intercambio virtual y aulas espejo",c:"#1e90ff",e:"💻"},{n:"Cooperación e innovación rural",c:"#00b894",e:"🌱"},{n:"Movilidad y redes académicas",c:"#ff9f1a",e:"✈️"}];
const GROUPS=[{n:"Grupo Origen",c:"#ff4f6d"},{n:"Grupo Cosecha",c:"#00b894"},{n:"Grupo Cumbre",c:"#6c3cff"},{n:"Grupo Raíz",c:"#ff9f1a"}];
// Pantallas en orden: la 0 es la portada (sin cronómetro).
const STEPS=[{t:"Inicio"},{t:"Momento 1"},{t:"Momento 2"},{t:"Momento 3"},{t:"Momento 4"},{t:"Cierre"}];
const PROD=[null,"Banco de oportunidades institucionales","Líneas estratégicas priorizadas","Borrador de la Ruta de Internacionalización 2027","Acuerdos iniciales y responsables"];
const NOTE_COLORS=["#ffe066","#8cf0d6","#ffb3c6","#a5d8ff","#d0bfff","#ffc999","#b2f2bb","#fff3a3","#ffa8d6"];
const MAX_VOTOS=3;
const KEY="ruta2027";
const MODE=new URLSearchParams(location.search).has("celular")?"celular":new URLSearchParams(location.search).has("grupo")?"grupo":"";
const PHONE=!!MODE;
let S=JSON.parse(localStorage.getItem(KEY)||"null")||{step:0,people:[],groups:[],cards:[],actions:[]};
let left=0,tick=null,total=0;
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const BASE=location.origin+location.pathname;
const PHONE_URL=BASE+"?celular", GROUP_URL=BASE+"?grupo";
// URL de la app web de Apps Script (ver Code.gs).
const SHEET_URL="https://script.google.com/macros/s/AKfycbzN8MsoFYEBNd31jCp1ol0HVd_ahASctc_HYr6YadPaaOMK5kdFGV-r3g7Cqn2bwt30/exec";
const post=o=>fetch(SHEET_URL,{method:"POST",mode:"no-cors",body:JSON.stringify(o)});
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const instOpts=()=>INST.map(i=>`<option>${esc(i)}</option>`).join("");
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const pull=async()=>({inbox:[],votos:[],matriz:[],groups:[],step:0,...await(await fetch(SHEET_URL)).json()});
const qr=(url,px)=>`<img width="${px}" height="${px}" alt="QR" style="border-radius:12px" src="https://api.qrserver.com/v1/create-qr-code/?size=${px*2}x${px*2}&data=${encodeURIComponent(url)}">`;
function copy(url,btn){navigator.clipboard.writeText(url).then(()=>{btn.textContent="✅ ¡Copiado!";setTimeout(()=>btn.textContent="📋 Copiar enlace",1800)})}

let pushT;
const save=()=>{S.ts=Date.now();localStorage.setItem(KEY,JSON.stringify(S));render();
  clearTimeout(pushT);pushT=setTimeout(()=>post(S).catch(()=>{}),600)};

// Facilitador: cada 5 s trae notas, votos y matrices enviados desde celulares (una fila por envío, así no se pisan).
if(!PHONE)setInterval(async()=>{try{
  const r=await pull(),{inbox,votos,matriz}=r;delete r.inbox;delete r.votos;delete r.matriz;
  if(/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))return;
  let ch=false;
  if(r.ts>(S.ts||0)){S=r;ch=true}
  inbox.filter(e=>!S.cards.some(c=>c.id==e.id)).forEach(e=>{S.cards.push({id:e.id,t:e.t,i:e.i,n:e.n,line:null,v:0});ch=true});
  S.cards.forEach(c=>{const v=votos.filter(x=>x.c==c.id).length;if(v!=c.v){c.v=v;ch=true}});
  matriz.filter(m=>!S.actions.some(a=>a.id==m.id)).forEach(m=>{S.actions.push({...m,ok:false});ch=true});
  if(ch)save();
}catch(e){}},5000);

function go(i){S.step=Math.max(0,Math.min(STEPS.length-1,i));
  // Al llegar al Momento 3 los grupos se forman solos (si ya existen no se reordenan; para eso está el botón).
  if(S.step==3&&!S.groups.length&&people().length)distribute();else save();
  const a=$("app");a.classList.remove("slide");void a.offsetWidth;a.classList.add("slide");scrollTo(0,0)}
// Navegación tipo presentación: flechas del teclado o botones ◀ ▶
document.addEventListener("keydown",e=>{if(PHONE||/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))return;
  if(e.key=="ArrowRight")go(S.step+1);if(e.key=="ArrowLeft")go(S.step-1)});
// Cronómetro independiente de los momentos: se elige 5/10/15/20 min y empieza a descontar.
function startTimer(m){clearInterval(tick);total=left=m*60;drawTimer();
  tick=setInterval(()=>{left--;drawTimer();if(left<=0){clearInterval(tick);timeUp()}},1000)}
function stopTimer(){clearInterval(tick);left=0;drawTimer()}
function drawTimer(){$("tm").textContent=String(left/60|0).padStart(2,"0")+":"+String(left%60).padStart(2,"0");
  $("clock").classList.toggle("low",left>0&&left<=60);$("bar").style.width=(total?left/total*100:0)+"%"}
function timeUp(){$("end").style.display="flex";
  try{const a=new AudioContext(),o=a.createOscillator();o.connect(a.destination);o.frequency.value=880;o.start();o.stop(a.currentTime+.6)}catch(e){}}

// Participantes = quienes enviaron aportes desde el celular + los agregados a mano, sin repetir.
function people(){const m=new Map();
  [...S.cards.filter(c=>c.n).map(c=>({n:c.n,i:c.i})),...S.people].forEach(p=>m.set(p.n.trim().toLowerCase()+"|"+p.i,p));
  return [...m.values()]}
// Distribución: se ordenan por institución y se reparten en ronda → cada institución queda repartida entre los 4 grupos y los tamaños quedan parejos.
function distribute(){
  const by={};people().forEach(p=>(by[p.i]??=[]).push(p));
  const order=shuffle(Object.keys(by)).flatMap(k=>shuffle(by[k]));
  S.groups=GROUPS.map(()=>[]);
  order.forEach((p,i)=>S.groups[i%4].push(p));
  save();
}
function addP(){const n=$("pn").value.trim();if(!n)return;S.people.push({n,i:$("pi").value});save()}

function render(){
  [viewHome,viewM1,viewM2,viewM3,viewM4,viewEnd][S.step]();
  const sub=document.querySelector(".sub");if(sub&&PROD[S.step])sub.insertAdjacentHTML("afterend",`<p><span class="chip" style="background:var(--sol);color:#1d1550;font-size:14px">🎯 Producto: ${PROD[S.step]}</span></p>`);
  $("prev").style.visibility=S.step?"visible":"hidden";$("next").style.visibility=S.step<STEPS.length-1?"visible":"hidden";
  $("clock").style.display=S.step?"":"none";document.body.classList.toggle("home",!S.step);
}

function viewHome(){
  $("app").innerHTML=`<div style="text-align:center;padding:0 0 3vh"><div style="font-size:clamp(36px,8vh,72px)">🌎✨</div>
  <h2 style="font-size:clamp(28px,6.5vh,64px)">Ruta de Internacionalización 2027</h2>
  <p class="sub" style="font-size:clamp(14px,2.6vh,24px)">Taller de cocreación · Universidades y Secretarías de Educación · Estudiantes rurales</p></div>
  <div class="grid">${[["📚","Identificar oportunidades","Cada universidad aporta estrategias, recursos y experiencias."],["🧩","Agrupar y priorizar","Organizamos las ideas en líneas estratégicas y votamos."],["🛠️","Diseñar las acciones","Equipos mixtos llenan la matriz de la Ruta."],["🤝","Validar compromisos","Plenaria: coincidencias, líderes y acuerdos."]].map((m,k)=>`<div class="panel g" style="--c:${LINES[k].c};text-align:center"><div style="font-size:44px">${m[0]}</div><h3>Momento ${k+1}</h3><b>${m[1]}</b><p class="sub" style="margin:6px 0 0">${m[2]}</p></div>`).join("")}</div>
  <p style="text-align:center;margin:3vh 0 1vh"><button class="btn alt" style="font-size:clamp(16px,3vh,22px);padding:1.4vh 32px" onclick="go(1)">Comenzar →</button></p>
  <p style="text-align:center;margin:0"><button class="btn ghost" style="font-size:12px;padding:6px 14px;opacity:.6" onclick="reset()">Reiniciar taller (borra todo)</button></p>`;
}
function reset(){if(!confirm("¿Borrar todos los datos del taller?"))return;
  post({accion:"limpiar"}).catch(()=>{}).finally(()=>{localStorage.removeItem(KEY);location.reload()})}
function viewEnd(){
  $("app").innerHTML=`<div style="text-align:center;padding:4vh 0"><div style="font-size:72px">🎉</div><h2 style="font-size:clamp(32px,6vw,60px)">¡Gracias por construir la Ruta 2027!</h2>
  <p class="sub" style="font-size:20px">Esto es lo que logramos hoy</p></div>
  <div class="grid">${[[people().length,"participantes"],[S.cards.length,"oportunidades identificadas"],[S.actions.length,"acciones diseñadas"],[GROUPS.length,"grupos de trabajo"]].map(x=>`<div class="panel" style="text-align:center"><div class="big">${x[0]}</div>${x[1]}</div>`).join("")}</div>
  <p style="text-align:center;margin-top:24px"><button class="btn alt" style="font-size:20px" onclick="exportCsv()">⬇ Descargar la matriz (Excel/CSV)</button></p>`;
}

// El QR chico abre un modal con el QR grande, para proyectarlo y escanearlo desde lejos.
function openQr(url,titulo){$("qrm").innerHTML=`<div class="panel" style="text-align:center;max-width:94vw" onclick="event.stopPropagation()"><h2>${titulo}</h2>${qr(url,Math.min(520,innerWidth*.8|0,innerHeight*.6|0))}
  <p><b style="word-break:break-all">${esc(url)}</b></p><button class="btn" onclick="copy('${url}',this)">📋 Copiar enlace</button> <button class="btn ghost" onclick="closeQr()">Cerrar</button></div>`;$("qrm").style.display="flex"}
const closeQr=()=>$("qrm").style.display="none";
document.addEventListener("keydown",e=>{if(e.key=="Escape")closeQr()});
// QR chico junto al encabezado (deja espacio a las notas); al hacer clic abre el modal con el QR grande, el enlace y "Copiar enlace".
const withQr=(left,url,titulo)=>`<div style="display:flex;gap:16px;align-items:flex-start;justify-content:space-between"><div style="flex:1 1 auto;min-width:0">${left}</div>
  <div title="Clic para ampliar" style="cursor:zoom-in;text-align:center;flex:0 0 auto;background:#fff;border-radius:16px;padding:8px;box-shadow:var(--sombra)" onclick="openQr('${url}','${titulo}')">${qr(url,96)}<div style="font-size:12px;font-weight:700;color:var(--prim);margin-top:2px">Clic para ampliar</div></div></div>`;

function viewM1(){
  $("app").innerHTML=withQr(`<h2>Momento 1 · Identificar oportunidades</h2><p class="sub">¿Qué estrategias, recursos o experiencias de internacionalización puede aportar tu institución? (aulas espejo, clases con docentes extranjeros, idiomas, redes…)</p>`,PHONE_URL,"📱 Participa desde tu celular")+`
  <div class="big" style="font-size:34px">${S.cards.length} <span style="font-size:18px;font-weight:600;color:var(--ink);-webkit-text-fill-color:var(--ink)">oportunidades</span></div>
  <div class="grid">${S.cards.map(noteHtml).join("")}</div>`;
}
// Contenido de una nota: primero quién (nombre e institución), luego el texto recortado con "Ver más" si es largo.
const LONG=140;
const noteBody=c=>`${c.n?`<div style="font-weight:800">${esc(c.n)}</div>`:""}<small style="margin:0 0 8px">${esc(c.i)}</small><div class="txt">${esc(c.t)}</div>${c.t.length>LONG?`<button class="more" onclick="openNote('${c.id}')">Ver más</button>`:""}`;
const noteHtml=c=>`<div class="note" draggable="true" ondragstart="event.dataTransfer.setData('t','${c.id}')" style="background:${NOTE_COLORS[INST.indexOf(c.i)%9]}">${noteBody(c)}${S.step==2?`<span class="vote">⭐ ${c.v||0}</span>`:""}</div>`;
function openNote(id){const c=S.cards.find(c=>c.id==id)||DATA.inbox.find(c=>c.id==id);if(!c)return;
  $("okm").innerHTML=`<div class="panel" style="max-width:680px;width:100%;max-height:90vh;overflow:auto;border-top:10px solid ${NOTE_COLORS[INST.indexOf(c.i)%9]}" onclick="event.stopPropagation()">
  <h2 style="margin-bottom:0">${esc(c.n)||"Aporte"}</h2><span class="chip">${esc(c.i)}</span>
  <p style="white-space:pre-wrap;font-size:18px;line-height:1.6">${esc(c.t)}</p>
  <p style="text-align:right;margin-bottom:0"><button class="btn" onclick="$('okm').style.display='none'">Cerrar</button></p></div>`;$("okm").style.display="flex"}

function viewM2(){
  const pool=S.cards.filter(c=>c.line==null);
  $("app").innerHTML=`<h2>Momento 2 · Agrupar y priorizar</h2><p class="sub">Arrastra cada nota a su línea estratégica. Los participantes votan desde su celular (${MAX_VOTOS} votos c/u) por las ideas que sirvan a estudiantes rurales, sean viables en 2027 y reúnan varias instituciones.</p>
  <div class="col" style="--c:#888;margin-bottom:14px" ondragover="dov(event)" ondragleave="this.classList.remove('over')" ondrop="drop(event,null)"><h4>Sin clasificar (${pool.length})</h4><div class="grid">${pool.map(noteHtml).join("")}</div></div>
  <div class="cols">${LINES.map((l,k)=>`<div class="col" style="--c:${l.c}" ondragover="dov(event)" ondragleave="this.classList.remove('over')" ondrop="drop(event,${k})"><h4>${l.e} ${l.n}</h4>${S.cards.filter(c=>c.line===k).sort((a,b)=>b.v-a.v).map(noteHtml).join("")}</div>`).join("")}</div>`;
}
function dov(e){e.preventDefault();e.currentTarget.classList.add("over")}
function drop(e,k){e.preventDefault();const c=S.cards.find(c=>c.id==e.dataTransfer.getData("t"));if(c){c.line=k;save()}}

function viewM3(){
  const top=S.cards.filter(c=>c.v>0).sort((a,b)=>b.v-a.v).slice(0,6);
  $("app").innerHTML=withQr(`<h2>Momento 3 · Diseñar las acciones</h2><p class="sub">Grupos mixtos al azar. <b>Un solo participante por grupo</b> escanea el QR, elige su grupo y llena la matriz. Ideas más votadas: ${top.map(c=>`<span class="chip">${esc(c.t.slice(0,40))} (${c.v}⭐)</span>`).join("")||"—"}</p>`,GROUP_URL,"📝 Matriz del grupo (1 persona por grupo)")+`
  <div class="row" style="margin-top:12px"><button class="btn alt" onclick="distribute()" ${people().length<4?"disabled":""}>🎲 ${S.groups.length?"Volver a organizar":"Organizar"} en 4 grupos</button>
  <span class="chip">${people().length} participantes</span>
  <input id="pn" placeholder="Agregar a alguien que no envió aporte" style="flex:2 1 220px"><select id="pi">${instOpts()}</select><button class="btn ghost" onclick="addP()">Agregar</button></div>
  <div class="grid">${S.groups.length?GROUPS.map((G,k)=>{const A=S.actions.filter(a=>a.g==k);return`<div class="panel g" style="--c:${G.c}"><h3>${G.n} · ${(S.groups[k]||[]).length}</h3>${(S.groups[k]||[]).map(p=>`<div style="padding:4px 0"><b>${esc(p.n)}</b><br><small>${esc(p.i)}</small></div>`).join("")}
  <hr style="opacity:.15"><span class="chip">${A.length} acciones en la matriz</span>${A.map(a=>`<div style="margin-top:6px"><span class="chip" style="background:${LINES[a.line].c};color:#fff">${LINES[a.line].e}</span> ${esc(a.a)}</div>`).join("")}</div>`}).join(""):`<div class="panel">Pulsa <b>Organizar</b> para formar los grupos con quienes enviaron su aporte.</div>`}</div>`;
}

function viewM4(){
  $("app").innerHTML=`<h2>Momento 4 · Validar compromisos</h2><p class="sub">Plenaria: cada grupo presenta sus acciones. Haz clic en una tarjeta para ver toda la información que registraron.</p>
  <div class="row"><button class="btn alt" onclick="exportCsv()">⬇ Exportar matriz (Excel/CSV)</button><span class="chip">${S.actions.length} acciones</span></div>
  ${LINES.map((l,k)=>{const A=S.actions.filter(a=>a.line==k);return`<div class="panel g" style="--c:${l.c};margin-bottom:14px"><h3>${l.e} ${l.n} (${A.length})</h3>
  <div class="grid">${A.map(a=>`<div class="note" style="background:#fff;border-left:8px solid ${GROUPS[a.g].c};border-radius:12px;cursor:pointer;transform:none" onclick="openA('${a.id}')">
  <span class="chip" style="background:${GROUPS[a.g].c};color:#fff">${GROUPS[a.g].n}</span><div style="margin-top:6px;font-weight:600;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden">${esc(a.a)}</div>
  <small>🏛️ ${esc(a.l)||"Sin institución líder"}</small></div>`).join("")||"<small>Sin acciones aún</small>"}</div></div>`}).join("")}`;
}
// Modal con todo lo que el grupo registró en la matriz.
function openA(id){const a=S.actions.find(a=>a.id==id);if(!a)return;const L=LINES[a.line],G=GROUPS[a.g];
  const f=(t,v)=>`<div style="margin-top:10px"><small style="font-weight:700;opacity:.7">${t}</small><div>${esc(v)||"—"}</div></div>`;
  $("okm").innerHTML=`<div class="panel" style="max-width:640px;width:100%;max-height:90vh;overflow:auto;border-top:10px solid ${G.c}" onclick="event.stopPropagation()">
  <span class="chip" style="background:${G.c};color:#fff">${G.n}</span><span class="chip" style="background:${L.c};color:#fff">${L.e} ${L.n}</span>
  <h2 style="margin-top:8px">${esc(a.a)}</h2>${f("👥 Población participante",a.p)}${f("🏛️ Institución líder",a.l)}${f("🤝 Aliados potenciales",a.al)}${f("📅 Periodo tentativo",a.per)}${f("🧰 Recursos requeridos",a.r)}${f("✅ Evidencia de cumplimiento",a.ev)}
  <p style="text-align:right;margin-bottom:0"><button class="btn" onclick="$('okm').style.display='none'">Cerrar</button></p></div>`;$("okm").style.display="flex"}
function exportCsv(){
  const q=v=>`"${String(v??"").replace(/"/g,'""')}"`;
  const rows=[["Línea estratégica","Grupo","Acción","Población","Institución líder","Aliados","Periodo","Recursos","Evidencia"],
  ...S.actions.map(a=>[LINES[a.line].n,GROUPS[a.g].n,a.a,a.p,a.l,a.al,a.per,a.r,a.ev])];
  const b=new Blob(["\ufeff"+rows.map(r=>r.map(q).join(",")).join("\n")],{type:"text/csv"});
  const l=document.createElement("a");l.href=URL.createObjectURL(b);l.download="Ruta-Internacionalizacion-2027.csv";l.click();
}

// ---------- Celular de participante (?celular): aporte del Momento 1 + tablero para votar ----------
let DATA={inbox:[],votos:[],matriz:[],groups:[],step:0};
const store=k=>JSON.parse(localStorage.getItem(KEY+k)||"{}");
const put=(k,v)=>localStorage.setItem(KEY+k,JSON.stringify(v));
function phoneView(){
  ["clock","prev","next"].forEach(i=>$(i).style.display="none");
  document.querySelector("header p").textContent=MODE=="celular"?"Tu celular · aporte y votación":"Matriz de tu grupo";
  (MODE=="celular"?celularView:grupoView)();
  const refresh=async()=>{try{DATA=await pull();MODE=="celular"?drawTab():drawGrupo()}catch(e){}};
  refresh();setInterval(refresh,5000);
}
function celularView(){
  const me=store("_yo");if(!me.id){me.id=uid();put("_yo",me)}
  $("app").innerHTML=`<h2>Momento 1 · Tu aporte</h2><p class="sub">¿Qué estrategia, recurso o experiencia de internacionalización puede aportar tu institución?</p>
  <div class="panel form"><input id="pn" class="full" placeholder="Tu nombre" value="${esc(me.n)}"><select id="pi" class="full">${instOpts()}</select>
  <textarea id="pt" class="full" rows="4" placeholder="Escribe tu oportunidad…"></textarea>
  <button class="btn full" id="ps" style="font-size:18px">Enviar</button><div id="pm" class="full" style="font-weight:700"></div></div>
  <div id="tab" style="margin-top:22px"></div>`;
  if(me.i)$("pi").value=me.i;
  $("ps").onclick=()=>{const n=$("pn").value.trim(),t=$("pt").value.trim();
    if(!n||!t){$("pm").textContent="Escribe tu nombre y tu aporte.";return}
    const i=$("pi").value,e={id:uid(),n,i,t};$("pm").textContent="";
    enviar($("ps"),{accion:"nota",...e},()=>{const m=store("_yo");put("_yo",{...m,n,i,sent:(m.sent||0)+1});
      DATA.inbox.push(e);$("pt").value="";drawTab()},"¡Aporte enviado!","Ya aparece en el tablero. Puedes enviar otro aporte o ver las ideas de los demás.")};
  drawTab();
}
// El tablero aparece cuando la persona ya envió su aporte; el voto se abre cuando el facilitador llega al Momento 2.
function drawTab(){
  const me=store("_yo"),el=$("tab");if(!el)return;
  if(!me.sent){el.innerHTML="";return}
  const mine=DATA.votos.filter(v=>v.v==me.id),open=DATA.step>=2,rest=MAX_VOTOS-mine.length;
  el.innerHTML=`<h2>Tablero de ideas (${DATA.inbox.length})</h2><p class="sub">${open?`Vota por las ideas que sirvan a estudiantes rurales, sean viables en 2027 y reúnan varias instituciones. Te quedan <b>${rest}</b> de ${MAX_VOTOS} votos.`:"La votación se abrirá en el Momento 2. Mientras tanto, mira lo que proponen los demás."}</p>
  ${DATA.inbox.map(c=>{const mio=mine.some(v=>v.c==c.id),n=DATA.votos.filter(v=>v.c==c.id).length;
    return`<div class="note" style="background:${NOTE_COLORS[INST.indexOf(c.i)%9]};transform:none">${noteBody(c)}
    <button class="vote" ${mio||!open||rest<=0?"disabled":""} onclick="vota('${c.id}')">${mio?"✔ Votaste":"⭐ Votar"} · ${n}</button></div>`}).join("")}`;
}
function vota(c){const me=store("_yo");DATA.votos.push({c,v:me.id});drawTab();post({accion:"voto",c,v:me.id})}

// ---------- Celular del grupo (?grupo): un participante por grupo llena la matriz ----------
function grupoView(){
  $("app").innerHTML=`<h2>Momento 3 · Matriz del grupo</h2><div id="gsel"></div><div id="gfrm"></div><div id="glist"></div>`;
  drawGrupo();
}
function drawGrupo(){
  const g=store("_grupo").g,sel=$("gsel");if(!sel)return;
  if(g==null){
    $("gfrm").innerHTML="";$("glist").innerHTML="";
    sel.innerHTML=DATA.groups.length?`<p class="sub">Elige tu grupo:</p><div class="grid">${GROUPS.map((G,k)=>`<button class="btn" style="background:${G.c};font-size:20px;padding:18px" onclick="elige(${k})">${G.n}</button>`).join("")}</div>`
      :`<p class="sub">Aún no se han organizado los grupos. Espera a que el facilitador los forme en el Momento 3.</p>`;
    return}
  const G=GROUPS[g],miembros=DATA.groups[g]||[];
  sel.innerHTML=`<div class="panel g" style="--c:${G.c}"><h3>${G.n}</h3>${miembros.map(p=>`<span class="chip">${esc(p.n)} · ${esc(p.i)}</span>`).join("")||"Sin integrantes"}
  <p><button class="btn ghost" style="font-size:12px;padding:6px 12px" onclick="put('_grupo',{});drawGrupo()">Cambiar de grupo</button></p></div>`;
  if(!$("gf")){
    $("gfrm").innerHTML=`<div class="panel form" id="gf" style="margin-top:14px"><select id="l" class="full">${LINES.map((l,i)=>`<option value="${i}">${l.e} ${l.n}</option>`).join("")}</select>
    <textarea id="a" class="full" rows="3" placeholder="1. Acción propuesta"></textarea>
    <input id="p" placeholder="2. Población participante">
    <select id="d"><option value="">3. Institución líder</option>${instOpts()}</select>
    <input id="al" placeholder="4. Aliados potenciales">
    <input id="pe" placeholder="5. Periodo tentativo (ej. II semestre 2027)">
    <input id="r" class="full" placeholder="6. Recursos requeridos">
    <input id="ev" class="full" placeholder="Evidencia de cumplimiento">
    <button class="btn full" style="font-size:18px" onclick="enviaA(this)">Enviar acción</button><div id="gm" class="full" style="font-weight:700"></div></div>`}
  $("glist").innerHTML=`<h3 style="color:${G.c}">Acciones de tu grupo</h3>`+(DATA.matriz.filter(m=>m.g==g).map(m=>`<div class="panel" style="margin-bottom:8px"><span class="chip" style="background:${LINES[m.line].c};color:#fff">${LINES[m.line].e}</span> ${esc(m.a)}</div>`).join("")||"<small>Aún no hay acciones.</small>");
}
function elige(k){put("_grupo",{g:k});drawGrupo()}
function enviaA(btn){const g=store("_grupo").g,a=$("a").value.trim();if(!a){$("gm").textContent="Escribe la acción propuesta.";return}
  const m={id:uid(),g,line:+$("l").value,a,p:$("p").value,l:$("d").value,al:$("al").value,per:$("pe").value,r:$("r").value,ev:$("ev").value};$("gm").textContent="";
  enviar(btn,{accion:"matriz",...m},()=>{DATA.matriz.push(m);["a","p","d","al","pe","r","ev"].forEach(i=>$(i).value="");drawGrupo()},"¡Acción enviada!","Quedó registrada en la matriz de tu grupo. Puedes agregar otra.")}
// Envío con el botón bloqueado (evita duplicados), indicador "Enviando…" y confirmación en un modal.
function enviar(btn,payload,onOk,titulo,detalle){
  if(btn.disabled)return;
  const txt=btn.textContent;btn.disabled=true;btn.innerHTML='<span class="spin"></span> Enviando…';
  Promise.all([post(payload),new Promise(r=>setTimeout(r,700))])
    .then(()=>{onOk();$("okm").innerHTML=`<div class="panel" style="text-align:center;max-width:420px" onclick="event.stopPropagation()"><div style="font-size:64px">✅</div><h2>${titulo}</h2><p>${detalle}</p><button class="btn" onclick="$('okm').style.display='none'">Listo</button></div>`;$("okm").style.display="flex"})
    .catch(()=>{$("okm").innerHTML=`<div class="panel" style="text-align:center;max-width:420px" onclick="event.stopPropagation()"><div style="font-size:64px">⚠️</div><h2>No se pudo enviar</h2><p>Revisa tu conexión e intenta de nuevo. Tu texto sigue ahí.</p><button class="btn" onclick="$('okm').style.display='none'">Entendido</button></div>`;$("okm").style.display="flex"})
    .finally(()=>{btn.disabled=false;btn.textContent=txt})}

PHONE?phoneView():(render(),drawTimer());
</script>
</body>
</html>
